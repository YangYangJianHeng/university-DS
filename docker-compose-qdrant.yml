# ===================================================
# 组队星 (TeamStar) - Qdrant 向量数据库
# 本地单机部署，数据持久化到 D 盘项目根目录
# ===================================================
# 
# 启动方式：
#   docker compose -f docker-compose-qdrant.yml up -d
#
# 管理面板：http://localhost:6333/dashboard
# API 文档：http://localhost:6333/docs
# ===================================================

version: "3.8"

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: teamstar-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API（HTTP）
      - "6334:6334"   # gRPC
    volumes:
      # 数据持久化到 D 盘项目根目录的 qdrant_data 目录
      - ./qdrant_data:/qdrant/storage:z
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__LOG_LEVEL=INFO
    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
