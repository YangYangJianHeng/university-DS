server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: university-team-platform
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    #jdbc:mysql://localhost:3306/university_platform?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/university_platform?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:7500}
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 600000

  sql:
    init:
      mode: always
      schema-locations: classpath:init-all.sql
      defer-datasource-initialization: true
      continue-on-error: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      #password: ${REDIS_PASSWORD:7500}
      database: ${REDIS_DB:0}
      timeout: 3000
      lettuce:
        pool:
          enabled: true
          max-active: 8
          max-idle: 8
          min-idle: 0

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.platform.module.**.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: is_deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

knife4j:
  enable: true
  setting:
    language: zh-CN

platform:
  jwt:
    secret: ${JWT_SECRET:YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXoxMjM0NTY3ODkwYWJjZGVmZ2hpamtsbW5vcA==}
    expiration: 86400000
  file:
    upload-dir: ./uploads
    max-size: 52428800
    sign-secret: ${FILE_SIGN_SECRET:dGhpc19pc19hX2ZpbGVfc2lnbl9zZWNyZXRfa2V5XzMyYnl0ZXM=}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:admin}
    secret-key: ${MINIO_SECRET_KEY:admin123456}
    bucket: ${MINIO_BUCKET:platform-files}
  ai:
    provider: ${AI_PROVIDER:openai}
    embed-provider: ${AI_EMBED_PROVIDER:ollama}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat-model: ${OLLAMA_CHAT_MODEL:mymodel}
      embedding-model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
      timeout-seconds: ${OLLAMA_TIMEOUT_SECONDS:120}
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.deepseek.com}
      api-key: ${OPENAI_API_KEY:}
      chat-model: ${OPENAI_CHAT_MODEL:deepseek-v4-flash}
      embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
    rag:
      store-type: ${RAG_STORE_TYPE:qdrant_local}
      qdrant-base-url: ${QDRANT_BASE_URL:http://localhost:6333}
      qdrant-collection-prefix: ${QDRANT_COLLECTION_PREFIX:university_ds}
      qdrant-vector-size: ${QDRANT_VECTOR_SIZE:768}
      qdrant-storage-path: ${QDRANT_STORAGE_PATH:./qdrant_data}
      qdrant-enabled: ${QDRANT_ENABLED:true}
      auto-build: ${RAG_AUTO_BUILD:true}
      include-projects: ${RAG_INCLUDE_PROJECTS:true}
      include-competitions: ${RAG_INCLUDE_COMPETITIONS:true}
      include-teams: ${RAG_INCLUDE_TEAMS:false}
    chat:
      max-rounds: ${CHAT_MAX_ROUNDS:20}
      compress-trigger: ${CHAT_COMPRESS_TRIGGER:15}
      compress-keep-recent: ${CHAT_COMPRESS_KEEP_RECENT:5}
